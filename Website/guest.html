<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotter AI</title>
  <link rel="icon" type="image/png" sizes="16x16" href="SpotterAI-Robot-favicon.png">

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">
</head>

<body class="home-page">

  <header class="nav">       
    <a href="home.html" class="logo">SpotterAI</a>  
    <ul class="nav-links">
      <li><a href="profile.html"> Profile </a></li>
      <li><a href="saved_meal_plans.html"> Meal plans </a></li>
      <li><a href="saved_workouts.html"> Saved Workouts </a></li>
    </ul>
  </header>
<script>
  const loggedIn = localStorage.getItem("loggedIn");

  // If not logged in, show login modal after 5 seconds
  if (!loggedIn) {
    setTimeout(() => {
      document.getElementById("login-modal").style.display = "flex";
    }, 5000); // 5000 ms = 5 seconds
  }
</script>

  <main class="page_guest">
    <section class="hero">
      <h1>SpotterAI</h1>
      <p>Ask a question about training or nutrition.</p>

      <!-- CHAT MESSAGES AREA -->
      <div id="chat-window" class="chat-window">
        <!-- Messages will be appended here by JS -->
      </div>

      <!-- INPUT AREA -->
      <div class="chat-input-wrapper">
        <textarea
          class="chat-input"
          id="chat-input"
          placeholder="Ask a question..."
          rows="1"
        ></textarea>
        <button id="send-button" aria-label="Send">
          <img src="up-arrow-icon.webp" alt="Send">
        </button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>

  <script>
    const textarea = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');
    const chatWindow = document.getElementById('chat-window');

    const md = window.markdownit({
      breaks: true,
      linkify: true,
      html: false
    });

    function renderMarkdown(text) {
      return DOMPurify.sanitize(md.render(text || ''));
    }

    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    });

    sendButton.addEventListener('click', () => {
      handleSend();
    });

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = `chat-row ${role}`;

      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${role}`;

      if (role === 'assistant') {
        bubble.innerHTML = renderMarkdown(text);
      } else {
        bubble.textContent = text;
      }

      row.appendChild(bubble);
      chatWindow.appendChild(row);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    const API_URL = "https://expletive-morbidly-rockstar.ngrok-free.dev";

    async function handleSend() {
      const question = textarea.value.trim();
      if (!question) return;

      appendMessage('user', question);
      textarea.value = '';
      textarea.style.height = 'auto';

      const loadingMsg = document.createElement('div');
      loadingMsg.classList.add('chat-message', 'assistant');
      loadingMsg.textContent = 'Thinking...';
      chatWindow.appendChild(loadingMsg);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      try {
        const res = await fetch(`${API_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question }),
        });

        if (!res.ok) throw new Error(`Server error: ${res.status}`);

        const data = await res.json();
        loadingMsg.remove();

        if (data.error) {
          appendMessage('assistant', `**Error:** ${data.error}`);
        } else {
          appendMessage('assistant', data.answer);
        }
      } catch (err) {
        loadingMsg.innerHTML = renderMarkdown(
          `**Connection error** — is the API running?\n\n\`${err.message}\``
        );
      }
    }
  </script>
<div id="login-modal" class="login-modal">
  <div class="login-box">
    <h2>Login Required</h2>
    <p>You must log in to continue using SpotterAI.</p>
    <button class="login-btn" onclick="window.location.href='login.html'">Log In</button>
  </div>
</div>

<style>
  /* Fullscreen overlay */
  .login-modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  /* Modal box styled like your dark UI */
  .login-box {
    background: #1a1a1a;
    color: white;
    padding: 30px 40px;
    border-radius: 12px;
    text-align: center;
    width: 320px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    animation: fadeIn 0.3s ease-out;
  }

  .login-box h2 {
    margin-bottom: 10px;
    font-size: 24px;
    font-weight: 600;
  }

  .login-box p {
    margin-bottom: 20px;
    font-size: 15px;
    opacity: 0.85;
  }

  /* Button matches your theme */
  .login-btn {
    width: 100%;
    padding: 12px;
    background: #1133c8;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .login-btn:hover {
    background: #1133c8;
  }

  /* Smooth fade-in animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</body>
</html>
